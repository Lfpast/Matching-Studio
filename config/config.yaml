data:
  raw_csv: data/raw/professor_information.csv
  projects_csv: data/raw/professor_projects.csv
  publications_csv: data/raw/professor_publications.csv
  deeptech_auto_discovery:
    enabled: true
    directory: data/raw/
    recursive: false
    filename_regex: '^(?P<source>[A-Za-z]+)_(?P<year>\d{4})\.(?:xlsx|xls)$'
  startup_auto_discovery:
    enabled: true
    directory: data/raw/
    recursive: false
    filename_regex: '^startup_(?P<year>\d{4})\.(?:xlsx|xls)$'

embedding:
  model_name: sentence-transformers/all-mpnet-base-v2
  batch_size: 64

ollama:
  host: https://ollama.com
  api_key_env: OLLAMA_API_KEY
  chat_model: gemma4:cloud
  timeout_seconds: 120
  rerank_candidate_count: 12

startup:
  columns:
    people: "People"
    company_name: "English Name of company"
    ref_code: "Ref. Code"
    ref_code_link: "Ref. Code Link"
    funding: "Funding"
    background_year: "Background (Year)"
    category: "Category"
    description: "Brief Description"
    tel: "Tel"
    email: "Email"
    website: "Website"

  graph:
    similarity_threshold: 0.2
    category_weight: 0.6
    description_weight: 0.4

  matching:
    default_top_k: 5
    default_alpha: 1.0
    default_beta: 0.0
    default_graph_neighbor_weight: 0.2

  semantic_matching:
    dense_weight: 0.75
    lexical_weight: 0.25
    top_k_chunks: 3
    coverage_bonus: 0.08
    calibration_enabled: true
    calibration_floor: 0.30
    calibration_ceiling: 0.97
    calibration_min_top_score: 0.12
    weak_match_threshold: 0.08
    field_weights:
      company: 0.05
      description: 0.55
      category: 0.35
      meta: 0.05

professor:
  deeptech:
    columns:
      cluster: "OKT Tech Cluster"
      pi: "Principal Investigator (PI)"
      title: "Technology Title"
      trl: "Technology Readiness Level (TRL)"
      ip_status: "IP status"
      overview: "Technology Overview"
      tech_edges: "Key Technology Edges"
      app_1: "Potential Applications - 1st technology application"
      app_2: "Potential Applications - 2nd technology application (if any)"
      app_3: "Potential Applications - 3rd technology application (if any)"
      industry_1: "Applicable Industry - 1st industry"
      industry_2: "Applicable Industry - 2nd industry (if any)"

  graph:
    similarity_threshold: 0.2
    interests_weight: 0.2
    project_weight: 0.1
    paper_weight: 0.3
    deeptech_weight: 0.4

  semantic_matching:
    dense_weight: 0.75
    lexical_weight: 0.25
    top_k_chunks: 3
    coverage_bonus: 0.08
    calibration_enabled: true
    calibration_floor: 0.30
    calibration_ceiling: 0.97
    calibration_min_top_score: 0.12
    weak_match_threshold: 0.08
    field_weights:
      interests: 0.25
      project: 0.20
      paper: 0.20
      deeptech: 0.35

  matching:
    default_top_k: 5
    default_alpha: 0.8
    default_beta: 0.2
    default_graph_neighbor_weight: 0.1

  priority:
    default_title_score: 0.60
    title_weights:
      assistant_professor: 1.00
      associate_professor: 0.85
      professor: 0.70
      chair: 0.55
      associate_head: 0.40
      head: 0.25

# Query processing configuration
query:
  # Enable query validation
  enable_validation: true
  # Enable keyword extraction
  enable_keyword_extraction: true
  # Minimum similarity threshold (below = INVALID)
  similarity_threshold: 0.25
  # Weak relevance threshold (below = WEAK_RELEVANCE)
  weak_threshold: 0.35

auth:
  credentials:
    - username: "admin"
      password: "admin123"
  jwt_secret: "your_secret_key_here"
  token_ttl_minutes: 60
  session_ttl_hours: 24

file_upload:
  input_csv_destination: "./"
  input_csv_max_size_mb: 10
  deeptech_destination: "data/raw/"
  deeptech_max_size_mb: 50
  deeptech_allowed_extensions: [".xlsx", ".xls"]
  startup_destination: "data/raw/"
  startup_max_size_mb: 50
  startup_allowed_extensions: [".xlsx", ".xls"]
  temp_directory: "./temp/"

database_update:
  logs_directory: "./logs/"
  script_timeout_seconds: 3600
  progress_update_interval: 1
  fail_fast: false
  max_retries: 0

websocket:
  connection_timeout: 30
  heartbeat_interval: 30
